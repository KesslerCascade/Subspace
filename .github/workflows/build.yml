name: Main

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  win32:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
          cd subspace
          cmake --preset subspace-win32
      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
          cd subspace
          cmake --build --preset subspace-win32-dev-release
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win32-exe
          path: build/subspace-win32/RelWithDebInfo/*

  win64:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cd subspace
          cmake --preset subspace-win64
      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cd subspace
          cmake --build --preset subspace-win64-dev-release
          cd ..
          copy "build\subspace-win64\tools\RelWithDebInfo\mkdat.exe" "build\subspace-win64\RelWithDebInfo\"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win64-exe
          path: build/subspace-win64/RelWithDebInfo/*

  game-win32:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
          cd game
          cmake --preset game-win32
      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
          cd game
          cmake --build --preset game-dev-release
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: game-win32-exe
          path: build/game-win32/RelWithDebInfo/*

  mkdat:
    runs-on: windows-latest
    needs: [win64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download win64 executables
        uses: actions/download-artifact@v4
        with:
          name: win64-exe
      - name: Build subspace.dat
        shell: cmd
        run: mkdat subspace.dat data
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: subspace-dat
          path: subspace.dat

  package:
    runs-on: windows-latest
    needs: [win32, win64, game-win32, mkdat]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      - name: Assemble 32-bit package
        run: |
          mkdir package32
          cp win32-exe/subspace.exe package32/
          cp game-win32-exe/subspacegame.exe package32/
          cp subspace-dat/subspace.dat package32/
      - name: Assemble 64-bit package
        run: |
          mkdir package64
          cp win64-exe/subspace.exe package64/
          cp game-win32-exe/subspacegame.exe package64/
          cp subspace-dat/subspace.dat package64/
      - name: Upload 32-bit package
        uses: actions/upload-artifact@v4
        with:
          name: subspace-win32
          path: package32/*
      - name: Upload 64-bit package
        uses: actions/upload-artifact@v4
        with:
          name: subspace-win64
          path: package64/*
